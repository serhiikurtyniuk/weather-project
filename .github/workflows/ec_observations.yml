name: EC Observation Collector

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run EC observation collector
        run: python ec_observations.py

      - name: Commit and push new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ec_observations.csv
          git commit -m "EC observation collection" || echo "No changes to commit"
          git pull --rebase
          git push